# 開発環境用オーバーライド
# ローカル: docker compose -p pokenae-dev -f docker-compose.next.yml -f docker-compose.next.dev.yml up -d --build
# CI/CD:    docker compose -p pokenae-dev -f docker-compose.next.yml -f docker-compose.next.dev.yml up -d

services:
  app:
    build:
      target: runner
      args:
        NEXT_PUBLIC_ENVIRONMENT: development
    ports:
      - "${PORT:-3002}:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3002}
    restart: unless-stopped
    cpus: 0.10
    mem_limit: 256m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
