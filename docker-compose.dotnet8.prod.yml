services:
  pokenaetemplate-web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=PokenaeTemplate;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Sql1Password};TrustServerCertificate=True;
    ports:
      - "${APP_HTTP_PORT:-18280}:8080"
      - "${APP_HTTPS_PORT:-18281}:8081"
