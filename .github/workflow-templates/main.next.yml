name: Build and Deploy Router

on:
  push:
    branches:
      - main
      - develop
      - copilot/**
  pull_request:
    types: [closed]
    branches:
      - main
      - develop

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: ${{ !(contains(fromJSON('["main","develop"]'), github.ref_name) || (github.event_name == 'pull_request' && contains(fromJSON('["main","develop"]'), github.event.pull_request.base.ref))) }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

  build-main:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      image_tag: main
      environment: production
    secrets:
      api_url: ${{ secrets.PROD_API_URL }}
      google_redirect_uri: ${{ secrets.PROD_GOOGLE_REDIRECT_URI }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}

  build-develop:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      image_tag: develop
      environment: development
    secrets:
      api_url: ${{ secrets.DEV_API_URL }}
      google_redirect_uri: ${{ secrets.DEV_GOOGLE_REDIRECT_URI }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}

  # =================================================================
  # Azure Container Apps デプロイ（main ブランチ → ACA 本番環境）
  # =================================================================

  deploy-main-aca:
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.ACA_DEPLOY_ENABLED == 'true' && vars.ACA_APP_NAME_PROD != '' && vars.AZURE_RESOURCE_GROUP != ''
    needs: build-main
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-azure-container-apps.yml
    with:
      container_app_name: ${{ vars.ACA_APP_NAME_PROD }}
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      image: ghcr.io/${{ github.repository }}:main
      registry_server: ghcr.io
      registry_username: ${{ github.actor }}
      env_vars: "NODE_ENV=production PORT=3000 NEXTAUTH_URL=${{ vars.PROD_NEXTAUTH_URL_ACA }}"
    secrets:
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
      secret_env_vars: "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"

  # =================================================================
  # Azure Container Apps デプロイ（develop ブランチ → ACA 開発環境）
  # reusable-deploy-azure-container-apps.yml はアプリ種類に依存しない
  # 汎用ワークフロー。環境変数は env_vars / secret_env_vars で指定。
  # =================================================================

  # =================================================================
  # Azure Container Apps デプロイ（copilot/** ブランチ → ACA Copilot 環境）
  # Copilot コーディングエージェントが作成するブランチへの push 時にデプロイ
  # =================================================================

  build-copilot:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'copilot/')
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      image_tag: copilot
      environment: development
    secrets:
      api_url: ${{ secrets.DEV_API_URL }}
      google_redirect_uri: ${{ secrets.DEV_GOOGLE_REDIRECT_URI }}
      google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}

  deploy-copilot-aca:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'copilot/') && vars.ACA_DEPLOY_ENABLED == 'true' && vars.ACA_APP_NAME_COPILOT != '' && vars.AZURE_RESOURCE_GROUP != ''
    needs: build-copilot
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-azure-container-apps.yml
    with:
      container_app_name: ${{ vars.ACA_APP_NAME_COPILOT }}
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      image: ghcr.io/${{ github.repository }}:copilot
      registry_server: ghcr.io
      registry_username: ${{ github.actor }}
      env_vars: "NODE_ENV=production PORT=3000 NEXTAUTH_URL=${{ vars.COPILOT_NEXTAUTH_URL_ACA }}"
    secrets:
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
      secret_env_vars: "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"

  deploy-develop-aca:
    if: github.event_name == 'push' && github.ref_name == 'develop' && vars.ACA_DEPLOY_ENABLED == 'true' && vars.ACA_APP_NAME_DEV != '' && vars.AZURE_RESOURCE_GROUP != ''
    needs: build-develop
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy-azure-container-apps.yml
    with:
      container_app_name: ${{ vars.ACA_APP_NAME_DEV }}
      resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
      image: ghcr.io/${{ github.repository }}:develop
      registry_server: ghcr.io
      registry_username: ${{ github.actor }}
      env_vars: "NODE_ENV=production PORT=3000 NEXTAUTH_URL=${{ vars.DEV_NEXTAUTH_URL_ACA }}"
    secrets:
      azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
      secret_env_vars: "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
