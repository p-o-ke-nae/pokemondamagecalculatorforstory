name: Template Bootstrap

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "New project name (e.g. AcmePortal)※事前にAzurePortalのEntraID>gha-pokenae-bootstrap>証明書とシークレット>フェデレーション資格情報でリポジトリ名(小文字)とブランチ名を追加してください"
        required: true
        type: string
      azure_location:
        description: "Azure location"
        required: true
        default: "japanwest"
        type: string
      resource_group:
        description: "Azure resource group name (optional)"
        required: false
        default: ""
        type: string
      create_aca:
        description: "Create Azure Container Apps environments/apps (cost-incurring)"
        required: true
        default: true
        type: boolean
      aca_name_base:
        description: "ACA base name (required when create_aca=true, 1-23 chars, lowercase alnum or '-', start with a letter). Derived as <base>-aca-env / <base>-develop / <base>-copilot / <base>"
        required: false
        default: ""
        type: string
      update_repo_text:
        description: "Replace template names in repository files"
        required: true
        default: true
        type: boolean
      create_repo:
        description: "Create new GitHub repository from template"
        required: true
        default: true
        type: boolean
      repository_visibility:
        description: "Visibility for the generated GitHub repository"
        required: true
        default: "public"
        type: choice
        options:
          - private
          - public
      configure_copilot_guardrails:
        description: "Configure reviewed-PR guardrails for main/develop in the generated repository"
        required: true
        default: true
        type: boolean
      framework:
        description: "Application framework"
        required: true
        default: "dotnet10"
        type: choice
        options:
          - next
          - dotnet8
          - dotnet10
      port_base:
        description: "Base host port for the generated project (1000-59999, e.g. 18000)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      CREATE_ACA: ${{ inputs.create_aca }}
      UPDATE_REPO_TEXT: ${{ inputs.update_repo_text }}
      AZURE_LOCATION: ${{ inputs.azure_location }}
      RESOURCE_GROUP_INPUT: ${{ inputs.resource_group }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute slug and derived ACA names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          max_aca_name_length=31
          max_aca_base_length=23

          slug=$(echo "${PROJECT_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$slug" ]; then
            echo "[ERROR] project_name cannot be converted to slug"
            exit 1
          fi

          normalize_aca_base() {
            local candidate="$1"
            candidate=$(echo "$candidate" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
            if [ -z "$candidate" ]; then
              candidate="app"
            fi
            if [[ ! "$candidate" =~ ^[a-z] ]]; then
              candidate="app-$candidate"
            fi
            candidate=$(echo "$candidate" | sed -E 's/-+/-/g; s/^-+//; s/-+$//')
            echo "$candidate"
          }

          trim_aca_base_to_budget() {
            local base="$1"
            local budget="$2"
            local trimmed_base="$base"

            if [ "${#trimmed_base}" -gt "$budget" ]; then
              trimmed_base="${trimmed_base:0:$budget}"
            fi

            trimmed_base=$(echo "$trimmed_base" | sed -E 's/-+$//')
            if [ -z "$trimmed_base" ]; then
              trimmed_base="app"
              if [ "${#trimmed_base}" -gt "$budget" ]; then
                trimmed_base="${trimmed_base:0:$budget}"
              fi
            fi

            echo "$trimmed_base"
          }

          build_aca_name() {
            local base="$1"
            local suffix="$2"
            local candidate="${base}${suffix}"
            candidate=$(echo "$candidate" | sed -E 's/-+/-/g; s/^-+//; s/-+$//')
            echo "$candidate"
          }

          validate_aca_name() {
            local label="$1"
            local value="$2"
            local max_length="${3:-$max_aca_name_length}"

            if [ -z "$value" ]; then
              echo "[ERROR] $label is required."
              return 1
            fi

            if [ "${#value}" -gt "$max_length" ]; then
              echo "[ERROR] $label ('$value') must be ${max_length} characters or fewer."
              return 1
            fi

            if [[ "$value" == *"--"* ]]; then
              echo "[ERROR] $label ('$value') must not contain consecutive hyphens."
              return 1
            fi

            if [[ ! "$value" =~ ^[a-z]([a-z0-9-]{0,29}[a-z0-9])?$ ]]; then
              echo "[ERROR] $label ('$value') must use lowercase letters, numbers, or '-', start with a letter, and end with a letter or number."
              return 1
            fi
          }

          if [ -n "${RESOURCE_GROUP_INPUT}" ]; then
            rg="${RESOURCE_GROUP_INPUT}"
          else
            rg="${slug}-rg"
          fi

          aca_base=$(normalize_aca_base "$slug")
          suggested_base=$(trim_aca_base_to_budget "$aca_base" "$max_aca_base_length")
          suggested_env_name=$(build_aca_name "$suggested_base" "-aca-env")
          suggested_app_dev=$(build_aca_name "$suggested_base" "-develop")
          suggested_app_copilot=$(build_aca_name "$suggested_base" "-copilot")
          suggested_app_prod=$(build_aca_name "$suggested_base" "")

          base_input='${{ inputs.aca_name_base }}'

          if [ "${CREATE_ACA}" = "true" ] && [ -z "$base_input" ]; then
            echo "[ERROR] aca_name_base is required when create_aca=true. It must be ${max_aca_base_length} characters or fewer so derived ACA names stay within Azure's 31-character limit."
            echo "[ERROR] Suggested aca_name_base: $suggested_base"
            echo "[ERROR] Derived names: environment=$suggested_env_name develop=$suggested_app_dev copilot=$suggested_app_copilot main=$suggested_app_prod"
            exit 1
          fi

          if [ -n "$base_input" ]; then
            aca_name_source="user-specified-base"
          else
            aca_name_source="suggested-base"
          fi

          aca_name_base="${base_input:-$suggested_base}"
          validate_aca_name "aca_name_base" "$aca_name_base" "$max_aca_base_length"

          env_name=$(build_aca_name "$aca_name_base" "-aca-env")
          app_dev=$(build_aca_name "$aca_name_base" "-develop")
          app_copilot=$(build_aca_name "$aca_name_base" "-copilot")
          app_prod=$(build_aca_name "$aca_name_base" "")

          validate_aca_name "aca_environment_name (derived from aca_name_base)" "$env_name"
          validate_aca_name "aca_app_name_dev (derived from aca_name_base)" "$app_dev"
          validate_aca_name "aca_app_name_copilot (derived from aca_name_base)" "$app_copilot"
          validate_aca_name "aca_app_name_prod (derived from aca_name_base)" "$app_prod"

          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "resource_group=$rg" >> "$GITHUB_OUTPUT"
          echo "aca_name_base=$aca_name_base" >> "$GITHUB_OUTPUT"
          echo "aca_env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "app_dev=$app_dev" >> "$GITHUB_OUTPUT"
          echo "app_copilot=$app_copilot" >> "$GITHUB_OUTPUT"
          echo "app_prod=$app_prod" >> "$GITHUB_OUTPUT"
          echo "aca_name_source=$aca_name_source" >> "$GITHUB_OUTPUT"

      - name: Create GitHub repository
        if: inputs.create_repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "[ERROR] BOOTSTRAP_GITHUB_PAT secret is not set. A PAT with 'repo' and 'workflow' scopes is required."
            exit 1
          fi
          NEW_SLUG="${{ steps.names.outputs.slug }}"
          OWNER="${{ github.repository_owner }}"
          TEMPLATE_OWNER="${{ github.repository_owner }}"
          TEMPLATE_REPO="${{ github.event.repository.name }}"
          REPOSITORY_VISIBILITY="${{ inputs.repository_visibility }}"

          if [ "${REPOSITORY_VISIBILITY}" = "public" ]; then
            repo_private=false
          else
            repo_private=true
          fi

          gh api --method POST \
            "repos/${TEMPLATE_OWNER}/${TEMPLATE_REPO}/generate" \
            --field owner="$OWNER" \
            --field name="$NEW_SLUG" \
            --field private="$repo_private" \
            --field include_all_branches=false \
          && echo "[INFO] Repository ${OWNER}/${NEW_SLUG} created from template (${REPOSITORY_VISIBILITY})" \
          || {
            if gh api "repos/${OWNER}/${NEW_SLUG}" >/dev/null 2>&1; then
              echo "[INFO] Repository ${OWNER}/${NEW_SLUG} already exists, skipping creation"
            else
              echo "[ERROR] Failed to create repository ${OWNER}/${NEW_SLUG}"
              exit 1
            fi
          }

          echo "NEW_GH_REPO=${OWNER}/${NEW_SLUG}" >> "$GITHUB_ENV"

      - name: Copy collaborators from template repository
        if: inputs.create_repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_PAT }}
        run: |
          set -euo pipefail
          NEW_SLUG="${{ steps.names.outputs.slug }}"
          TEMPLATE_REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"

          gh api "repos/${TEMPLATE_REPO}/collaborators?affiliation=direct&per_page=100" \
            --jq '.[].login' | while read -r username; do

            if [ "$username" = "$OWNER" ]; then
              echo "[INFO] Skipping owner ${username}"
              continue
            fi

            raw_perm=$(gh api "repos/${TEMPLATE_REPO}/collaborators/${username}/permission" --jq '.permission')

            case "$raw_perm" in
              admin)    perm="admin" ;;
              write)    perm="push" ;;
              maintain) perm="maintain" ;;
              triage)   perm="triage" ;;
              *)        perm="pull" ;;
            esac

            gh api --method PUT \
              "repos/${OWNER}/${NEW_SLUG}/collaborators/${username}" \
              --field permission="$perm"
            echo "[INFO] Added ${username} as ${perm} to ${NEW_SLUG}"
          done

      # NOTE: BOOTSTRAP_GITHUB_PAT には repo + workflow に加え、生成先 repo の ruleset を更新できる権限が必要です
      - name: Replace template names in new repository
        if: inputs.update_repo_text && inputs.create_repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_PAT }}
        run: |
          $slug = "${{ steps.names.outputs.slug }}"
          $owner = "${{ github.repository_owner }}"
          $sourceRoot = (Get-Location).Path
          $generatedRepoPath = Join-Path $sourceRoot "new-repo"

          git clone "https://x-access-token:$env:GH_TOKEN@github.com/$owner/$slug.git" $generatedRepoPath

          Get-ChildItem -LiteralPath $sourceRoot -Force | Where-Object {
            $_.Name -notin @( ".git", "new-repo", "node_modules", ".next" )
          } | ForEach-Object {
            $destination = Join-Path $generatedRepoPath $_.Name

            if (Test-Path $destination) {
              Remove-Item -LiteralPath $destination -Recurse -Force
            }

            if ($_.PSIsContainer) {
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Recurse -Force
            } else {
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
            }
          }

          Write-Host "[INFO] Synced current workflow snapshot into new-repo"

          Push-Location $generatedRepoPath
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $framework = "${{ inputs.framework }}"
          $readmePath = Join-Path $generatedRepoPath "README.md"
          Write-Host "[INFO] Bootstrapping framework: $framework"
          Write-Host "[INFO] README target path: $readmePath"

          try {
            ./scripts/bootstrap-template.ps1 -ProjectName "${{ inputs.project_name }}" -Framework $framework -PortBase "${{ inputs.port_base }}" -OldSlug "pokenae" -OldSolutionName "pokenaeBaseSolution"
          } catch {
            Write-Host "[ERROR] Bootstrap failed for framework '$framework' in $generatedRepoPath"
            if (Test-Path $readmePath) {
              $readmeTextAfterFailure = [System.IO.File]::ReadAllText($readmePath)
              Write-Host "[ERROR] README length after failure: $($readmeTextAfterFailure.Length)"
            } else {
              Write-Host "[ERROR] README does not exist after failure"
            }
            throw
          }

          # 選択されたフレームワークのテンプレートをルートにコピーし、templates/ を削除
          $templateDir = "templates/$framework"
          if (Test-Path $templateDir) {
            Get-ChildItem $templateDir -Force | ForEach-Object {
              $dest = Join-Path "." $_.Name
              if (Test-Path $dest) {
                Remove-Item $dest -Recurse -Force
              }
              Move-Item $_.FullName $dest -Force
            }
            Write-Host "[INFO] Deployed template from $templateDir to repository root"
          } else {
            Write-Host "[WARN] Template directory $templateDir not found"
          }
          if (Test-Path "templates") {
            Remove-Item "templates" -Recurse -Force
            Write-Host "[INFO] Removed templates directory"
          }

          if (Test-Path ".github/workflow-templates") {
            $framework = "${{ inputs.framework }}"
            $mainTemplate = "main.${framework}.yml"
            $mainTemplatePath = ".github/workflow-templates/$mainTemplate"

            if (Test-Path $mainTemplatePath) {
              # 選択されたフレームワークの main.xxx.yml を main.yml としてコピー
              Move-Item $mainTemplatePath ".github/workflows/main.yml" -Force
              Write-Host "[INFO] Deployed $mainTemplate as main.yml"
            } else {
              Write-Host "[WARN] $mainTemplate not found in workflow-templates"
            }

            # 残りのファイルのうち main.*.yml 以外を workflows へ移動
            Get-ChildItem ".github/workflow-templates" -File | Where-Object {
              $_.Name -notmatch '^main\..+\.yml$'
            } | ForEach-Object {
              Move-Item $_.FullName ".github/workflows/$($_.Name)" -Force
            }

            Remove-Item ".github/workflow-templates" -Recurse -Force
            Write-Host "[INFO] Cleaned up workflow-templates directory"
          }

          $mainWorkflowPath = ".github/workflows/main.yml"
          if (-not (Test-Path $mainWorkflowPath)) {
            throw "Generated workflow '.github/workflows/main.yml' was not created."
          }

          $mainWorkflowText = [System.IO.File]::ReadAllText((Resolve-Path $mainWorkflowPath))
          $requiredWorkflowPatterns = @(
            '(?m)^\s*-\s*main\s*$',
            '(?m)^\s*-\s*develop\s*$',
            '(?m)^\s*-\s*copilot/\*\*\s*$',
            '(?m)^\s*test:\s*$',
            '(?m)^\s*build-main:\s*$',
            '(?m)^\s*deploy-main-aca:\s*$',
            '(?m)^\s*build-develop:\s*$',
            '(?m)^\s*deploy-develop-aca:\s*$',
            '(?m)^\s*build-copilot:\s*$',
            '(?m)^\s*deploy-copilot-aca:\s*$'
          )

          foreach ($pattern in $requiredWorkflowPatterns) {
            if ($mainWorkflowText -notmatch $pattern) {
              throw "Generated workflow '.github/workflows/main.yml' is missing required pattern: $pattern"
            }
          }

          Write-Host "[INFO] Validated generated main.yml workflow contract"

          # フレームワーク別に不要な Docker Compose ファイル・Dockerfile を削除
          $framework = "${{ inputs.framework }}"
          $filesToRemove = [System.Collections.Generic.List[string]]::new()

          if ($framework -eq "next") {
            Get-ChildItem -Filter "docker-compose.dotnet*.yml" -File | ForEach-Object { $filesToRemove.Add($_.FullName) }
            @("docker/Dockerfile.dotnet8", "docker/Dockerfile.dotnet10") | Where-Object { Test-Path $_ } | ForEach-Object { $filesToRemove.Add((Resolve-Path $_).Path) }
          } elseif ($framework -eq "dotnet8") {
            Get-ChildItem -Filter "docker-compose.next*.yml" -File    | ForEach-Object { $filesToRemove.Add($_.FullName) }
            Get-ChildItem -Filter "docker-compose.dotnet10*.yml" -File | ForEach-Object { $filesToRemove.Add($_.FullName) }
            @("docker/Dockerfile.next", "docker/Dockerfile.dotnet10") | Where-Object { Test-Path $_ } | ForEach-Object { $filesToRemove.Add((Resolve-Path $_).Path) }
          } elseif ($framework -eq "dotnet10") {
            Get-ChildItem -Filter "docker-compose.next*.yml" -File   | ForEach-Object { $filesToRemove.Add($_.FullName) }
            Get-ChildItem -Filter "docker-compose.dotnet8*.yml" -File | ForEach-Object { $filesToRemove.Add($_.FullName) }
            @("docker/Dockerfile.next", "docker/Dockerfile.dotnet8") | Where-Object { Test-Path $_ } | ForEach-Object { $filesToRemove.Add((Resolve-Path $_).Path) }
          }

          foreach ($f in $filesToRemove) {
            Remove-Item -LiteralPath $f -Force
            Write-Host "[INFO] Removed: $(Split-Path $f -Leaf)"
          }

          # フレームワーク別の tasks.json をコピーして tasks-templates ディレクトリを削除
          $tasksTemplatePath = ".vscode/tasks-templates/tasks.${framework}.json"
          if (Test-Path $tasksTemplatePath) {
            Copy-Item $tasksTemplatePath ".vscode/tasks.json" -Force
            Write-Host "[INFO] Deployed tasks.${framework}.json as .vscode/tasks.json"
          } else {
            Write-Host "[WARN] $tasksTemplatePath not found"
          }

          if (Test-Path ".vscode/tasks-templates") {
            Remove-Item ".vscode/tasks-templates" -Recurse -Force
            Write-Host "[INFO] Removed .vscode/tasks-templates directory"
          }

          if (-not (Test-Path $readmePath)) {
            throw "README.md was not generated in $generatedRepoPath"
          }

          $readmeText = [System.IO.File]::ReadAllText($readmePath)
          if ([string]::IsNullOrWhiteSpace($readmeText)) {
            throw "README.md is empty after bootstrap"
          }

          $requiredSections = if ($framework -eq "next") {
            @(
              @{
                DisplayName = "## ローカルの公開ポート"
                Pattern = '(?m)^## (?:\d+\.\s+)?ローカルの公開ポート\s*$'
              },
              @{
                DisplayName = "## GitHub Actions / デプロイ"
                Pattern = '(?m)^## (?:\d+\.\s+)?GitHub Actions / デプロイ\s*$'
              },
              @{
                DisplayName = "## Guardrails"
                Pattern = '(?m)^## (?:\d+\.\s+)?Guardrails\s*$'
              }
            )
          } else {
            @(
              @{
                DisplayName = "## ローカルの公開ポート"
                Pattern = '(?m)^## (?:\d+\.\s+)?ローカルの公開ポート\s*$'
              },
              @{
                DisplayName = "## EF Core Migrations"
                Pattern = '(?m)^## (?:\d+\.\s+)?EF Core Migrations\s*$'
              },
              @{
                DisplayName = "## Visual Studio で Infrastructure テストを実行する"
                Pattern = '(?m)^## (?:\d+\.\s+)?Visual Studio で Infrastructure テストを実行する\s*$'
              },
              @{
                DisplayName = "## GitHub Actions / デプロイ"
                Pattern = '(?m)^## (?:\d+\.\s+)?GitHub Actions / デプロイ\s*$'
              },
              @{
                DisplayName = "## Guardrails"
                Pattern = '(?m)^## (?:\d+\.\s+)?Guardrails\s*$'
              }
            )
          }

          foreach ($requiredSection in $requiredSections) {
            if ($readmeText -notmatch $requiredSection.Pattern) {
              throw "README.md is missing required section: $($requiredSection.DisplayName)"
            }
          }

          if ($framework -eq "next") {
            $forbiddenReadmePatterns = @(
              '(?m)^## (?:\d+\.\s+)?EF Core Migrations\s*$',
              '(?m)^## (?:\d+\.\s+)?Visual Studio で Infrastructure テストを実行する\s*$',
              'SQL Server',
              'INITIAL_ADMIN_GOOGLE_USER_ID'
            )

            foreach ($pattern in $forbiddenReadmePatterns) {
              if ($readmeText -match $pattern) {
                throw "README.md for next contains forbidden .NET-specific content: $pattern"
              }
            }
          }

          Write-Host "[INFO] Validated generated README.md"

          if (git status --porcelain) {
            git add -A
            git commit -m "chore: bootstrap template for ${{ inputs.project_name }}"
            git -c "http.https://github.com/.extraheader=" push
          } else {
            Write-Host "[INFO] No text replacement changes to commit"
          }
          Pop-Location

      - name: Configure branch guardrails in new repository
        id: guardrails
        if: inputs.create_repo && inputs.configure_copilot_guardrails
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_PAT }}
        run: |
          # Configure rules after bootstrap pushes complete so reviewed-PR rules
          # do not block the initial repository customization commit.
          ./scripts/configure-github-guardrails.ps1 `
            -Owner "${{ github.repository_owner }}" `
            -Repo "${{ steps.names.outputs.slug }}" `
            -BestEffort

      - name: Validate Azure auth inputs
        id: azure_auth
        if: inputs.create_aca
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          if [ -n "${AZURE_CREDENTIALS:-}" ]; then
            if ! echo "$AZURE_CREDENTIALS" | jq -e '.clientId and .tenantId and .subscriptionId and .clientSecret' >/dev/null; then
              echo "[ERROR] AZURE_CREDENTIALS must be JSON containing clientId, tenantId, subscriptionId, clientSecret"
              exit 1
            fi
            echo "use_service_principal=true" >> "$GITHUB_OUTPUT"
            echo "[INFO] Using AZURE_CREDENTIALS for azure/login"
          else
            if [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_SUBSCRIPTION_ID:-}" ]; then
              echo "[ERROR] Set either AZURE_CREDENTIALS secret or all of AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID secrets"
              exit 1
            fi
            echo "use_service_principal=false" >> "$GITHUB_OUTPUT"
            echo "client_id=${AZURE_CLIENT_ID}" >> "$GITHUB_OUTPUT"
            echo "tenant_id=${AZURE_TENANT_ID}" >> "$GITHUB_OUTPUT"
            echo "subscription_id=${AZURE_SUBSCRIPTION_ID}" >> "$GITHUB_OUTPUT"
            echo "[INFO] Using OIDC (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID) for azure/login"
          fi

      - name: Login to Azure (service principal JSON)
        if: inputs.create_aca && steps.azure_auth.outputs.use_service_principal == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure (OIDC)
        if: inputs.create_aca && steps.azure_auth.outputs.use_service_principal == 'false'
        uses: azure/login@v2
        with:
          client-id: ${{ steps.azure_auth.outputs.client_id }}
          tenant-id: ${{ steps.azure_auth.outputs.tenant_id }}
          subscription-id: ${{ steps.azure_auth.outputs.subscription_id }}

      - name: Create ACA environment and apps
        if: inputs.create_aca
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            RG='${{ steps.names.outputs.resource_group }}'
            LOC='${{ inputs.azure_location }}'
            ENV_NAME='${{ steps.names.outputs.aca_env_name }}'
            APP_DEV='${{ steps.names.outputs.app_dev }}'
            APP_COPILOT='${{ steps.names.outputs.app_copilot }}'
            APP_PROD='${{ steps.names.outputs.app_prod }}'

            az group create --name "$RG" --location "$LOC" >/dev/null

            LAW_NAME="$ENV_NAME-law"
            az monitor log-analytics workspace create --resource-group "$RG" --workspace-name "$LAW_NAME" --location "$LOC" >/dev/null

            LAW_ID=$(az monitor log-analytics workspace show --resource-group "$RG" --workspace-name "$LAW_NAME" --query customerId -o tsv)
            LAW_KEY=$(az monitor log-analytics workspace get-shared-keys --resource-group "$RG" --workspace-name "$LAW_NAME" --query primarySharedKey -o tsv)

            if ! az containerapp env show --name "$ENV_NAME" --resource-group "$RG" >/dev/null 2>&1; then
              az containerapp env create \
                --name "$ENV_NAME" \
                --resource-group "$RG" \
                --location "$LOC" \
                --logs-workspace-id "$LAW_ID" \
                --logs-workspace-key "$LAW_KEY" >/dev/null
            fi

            # フレームワークに応じたターゲットポートを設定
            FRAMEWORK='${{ inputs.framework }}'
            if [ "$FRAMEWORK" = "dotnet8" ] || [ "$FRAMEWORK" = "dotnet10" ]; then
              TARGET_PORT=8080
            else
              TARGET_PORT=3000
            fi

            create_app () {
              app_name="$1"
              if ! az containerapp show --name "$app_name" --resource-group "$RG" >/dev/null 2>&1; then
                az containerapp create \
                  --name "$app_name" \
                  --resource-group "$RG" \
                  --environment "$ENV_NAME" \
                  --image mcr.microsoft.com/azuredocs/containerapps-helloworld:latest \
                  --ingress external \
                  --target-port "$TARGET_PORT" \
                  --min-replicas 0 \
                  --max-replicas 1 >/dev/null
              fi
            }

            create_app "$APP_DEV"
            create_app "$APP_COPILOT"
            create_app "$APP_PROD"

            # Next.js の場合のみ NEXTAUTH_SECRET を生成・登録
            if [ "$FRAMEWORK" = "next" ]; then
              NEXTAUTH_SECRET=$(openssl rand -hex 32)
              for app in "$APP_DEV" "$APP_COPILOT" "$APP_PROD"; do
                az containerapp secret set --name "$app" --resource-group "$RG" --secrets nextauth-secret="$NEXTAUTH_SECRET" >/dev/null
              done
              echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> "$GITHUB_ENV"
            fi

            DEV_FQDN=$(az containerapp show --name "$APP_DEV" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            COPILOT_FQDN=$(az containerapp show --name "$APP_COPILOT" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            PROD_FQDN=$(az containerapp show --name "$APP_PROD" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)

            echo "DEV_NEXTAUTH_URL_ACA=https://$DEV_FQDN" >> "$GITHUB_ENV"
            echo "COPILOT_NEXTAUTH_URL_ACA=https://$COPILOT_FQDN" >> "$GITHUB_ENV"
            echo "PROD_NEXTAUTH_URL_ACA=https://$PROD_FQDN" >> "$GITHUB_ENV"

      - name: Sync GitHub secrets and variables
        id: repo_config
        if: inputs.create_repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_PAT }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "[ERROR] BOOTSTRAP_GITHUB_PAT secret is not set."
            exit 1
          fi

          FRAMEWORK='${{ inputs.framework }}'
          TEST_DB_HOST_PORT="$((${{ inputs.port_base }} + 34))"

          if [ "$FRAMEWORK" = "next" ]; then
            # Next.js build workflow が参照する secret 契約を先に揃える
            gh secret set GOOGLE_CLIENT_ID          --repo "$NEW_GH_REPO" --body "REPLACE_ME"
            gh secret set GOOGLE_CLIENT_SECRET      --repo "$NEW_GH_REPO" --body "REPLACE_ME"
            gh secret set DEV_API_URL               --repo "$NEW_GH_REPO" --body "REPLACE_ME"
            gh secret set PROD_API_URL              --repo "$NEW_GH_REPO" --body "REPLACE_ME"
            gh secret set DEV_GOOGLE_REDIRECT_URI   --repo "$NEW_GH_REPO" --body "REPLACE_ME"
            gh secret set PROD_GOOGLE_REDIRECT_URI  --repo "$NEW_GH_REPO" --body "REPLACE_ME"
            echo "db_test_config_status=not-applicable" >> "$GITHUB_OUTPUT"
            echo "db_test_config_message=No DB test configuration was required for the Next.js template." >> "$GITHUB_OUTPUT"
          else
            gh secret set CI_TEST_MSSQL_SA_PASSWORD --repo "$NEW_GH_REPO" --body "Sql1Password"
            gh variable set CI_TEST_MSSQL_DB        --repo "$NEW_GH_REPO" --body "${{ inputs.project_name }}"
            gh variable set CI_TEST_MSSQL_PID       --repo "$NEW_GH_REPO" --body "Developer"
            gh variable set CI_TEST_DB_HOST_PORT    --repo "$NEW_GH_REPO" --body "$TEST_DB_HOST_PORT"
            echo "db_test_config_status=configured" >> "$GITHUB_OUTPUT"
            echo "db_test_config_message=DB test password secret and non-sensitive variables were synced for Infrastructure SQL tests." >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.create_aca }}" = "true" ]; then
            gh variable set ACA_DEPLOY_ENABLED --repo "$NEW_GH_REPO" --body "true"
            echo "aca_status=provisioned" >> "$GITHUB_OUTPUT"
            echo "aca_message=ACA environments/apps were created and deployment variables were synced." >> "$GITHUB_OUTPUT"
          else
            gh variable set ACA_DEPLOY_ENABLED --repo "$NEW_GH_REPO" --body "false"
            echo "aca_status=skipped" >> "$GITHUB_OUTPUT"
            echo "aca_message=ACA auto-creation skipped because create_aca=false. Deployment jobs remain available but stay skipped until ACA_DEPLOY_ENABLED is set to true." >> "$GITHUB_OUTPUT"
            echo "[INFO] ACA auto-creation skipped because create_aca=false. Deployment jobs will stay skipped until ACA_DEPLOY_ENABLED is set to true."
          fi

          if [ "${{ inputs.create_aca }}" = "true" ]; then
            gh variable set AZURE_RESOURCE_GROUP --repo "$NEW_GH_REPO" --body "${{ steps.names.outputs.resource_group }}"

            gh variable set ACA_APP_NAME_DEV --repo "$NEW_GH_REPO" --body "${{ steps.names.outputs.app_dev }}"
            gh variable set ACA_APP_NAME_COPILOT --repo "$NEW_GH_REPO" --body "${{ steps.names.outputs.app_copilot }}"
            gh variable set ACA_APP_NAME_PROD --repo "$NEW_GH_REPO" --body "${{ steps.names.outputs.app_prod }}"

            if [ -n "${AZURE_CREDENTIALS:-}" ]; then
              gh secret set AZURE_CREDENTIALS --repo "$NEW_GH_REPO" --body "$AZURE_CREDENTIALS"
            else
              [ -n "${AZURE_CLIENT_ID:-}" ]       && gh secret set AZURE_CLIENT_ID       --repo "$NEW_GH_REPO" --body "$AZURE_CLIENT_ID"
              [ -n "${AZURE_TENANT_ID:-}" ]       && gh secret set AZURE_TENANT_ID       --repo "$NEW_GH_REPO" --body "$AZURE_TENANT_ID"
              [ -n "${AZURE_SUBSCRIPTION_ID:-}" ] && gh secret set AZURE_SUBSCRIPTION_ID --repo "$NEW_GH_REPO" --body "$AZURE_SUBSCRIPTION_ID"
            fi
          fi

          if [ "$FRAMEWORK" = "next" ]; then
            if [ "${{ inputs.create_aca }}" = "true" ]; then
              # Next.js 固有のシークレット・変数
              gh secret set NEXTAUTH_SECRET --repo "$NEW_GH_REPO" --body "$NEXTAUTH_SECRET"
              gh variable set DEV_NEXTAUTH_URL_ACA --repo "$NEW_GH_REPO" --body "$DEV_NEXTAUTH_URL_ACA"
              gh variable set COPILOT_NEXTAUTH_URL_ACA --repo "$NEW_GH_REPO" --body "$COPILOT_NEXTAUTH_URL_ACA"
              gh variable set PROD_NEXTAUTH_URL_ACA --repo "$NEW_GH_REPO" --body "$PROD_NEXTAUTH_URL_ACA"
            else
              gh secret set NEXTAUTH_SECRET --repo "$NEW_GH_REPO" --body "REPLACE_ME"
            fi

            echo "[WARN] GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / DEV_API_URL / PROD_API_URL / DEV_GOOGLE_REDIRECT_URI / PROD_GOOGLE_REDIRECT_URI にプレースホルダーを設定しました。Next.js workflow の実行前にプロジェクト固有の値へ更新してください。"
          fi

      - name: Summary
        shell: bash
        run: |
          guardrail_status="${{ steps.guardrails.outputs.status }}"
          guardrail_message="${{ steps.guardrails.outputs.message }}"
          if [ -z "$guardrail_status" ]; then
            if [ "${{ inputs.configure_copilot_guardrails }}" = "true" ] && [ "${{ inputs.create_repo }}" = "true" ]; then
              guardrail_status="not-run"
              guardrail_message="Guardrail step was not executed."
            else
              guardrail_status="not-requested"
              guardrail_message="Guardrail configuration was not requested for this run."
            fi
          fi

          aca_status="${{ steps.repo_config.outputs.aca_status }}"
          aca_message="${{ steps.repo_config.outputs.aca_message }}"
          if [ -z "$aca_status" ]; then
            aca_status="not-applicable"
            aca_message="Repository creation was skipped, so ACA deployment variables were not synchronized."
          fi

          db_test_config_status="${{ steps.repo_config.outputs.db_test_config_status }}"
          db_test_config_message="${{ steps.repo_config.outputs.db_test_config_message }}"
          if [ -z "$db_test_config_status" ]; then
            db_test_config_status="not-applicable"
            db_test_config_message="Repository creation was skipped, so DB test configuration was not synchronized."
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Template Bootstrap Completed
          - Project name: \`${{ inputs.project_name }}\`
          - Project slug: \`${{ steps.names.outputs.slug }}\`
          - Resource group: \`${{ steps.names.outputs.resource_group }}\`
          - ACA name source: \`${{ steps.names.outputs.aca_name_source }}\`
          - ACA base name: \`${{ steps.names.outputs.aca_name_base }}\`
          - ACA Environment: \`${{ steps.names.outputs.aca_env_name }}\`
          - Apps:
            - \`${{ steps.names.outputs.app_dev }}\`
            - \`${{ steps.names.outputs.app_copilot }}\`
            - \`${{ steps.names.outputs.app_prod }}\`
          - Framework: \`${{ inputs.framework }}\`
          - Repo text replacement: \`${{ inputs.update_repo_text }}\`
          - GitHub repo creation: \`${{ inputs.create_repo }}\`
          - ACA provisioning: \`${{ inputs.create_aca }}\`
          - ACA status: \`$aca_status\` — $aca_message
          - DB test config: \`$db_test_config_status\` — $db_test_config_message
          - Guardrails: \`$guardrail_status\` — $guardrail_message
          EOF
