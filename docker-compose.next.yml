# Next.js ベース共通設定（ローカル・CI/CD 共通）
# 使い方（-p でプロジェクト名を分けることで複数環境を同時起動可能）:
#   Debug: docker compose -p pokenae-debug -f docker-compose.next.yml -f docker-compose.next.debug.yml up --build
#   Dev:   docker compose -p pokenae-dev -f docker-compose.next.yml -f docker-compose.next.dev.yml up -d --build
#   Prod:  docker compose -p pokenae-prod -f docker-compose.next.yml -f docker-compose.next.prod.yml up -d --build
# CI/CD では IMAGE 環境変数で GHCR のイメージを指定し、--no-build で起動する

services:
  app:
    image: ${IMAGE:-pokenae-web:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_GOOGLE_REDIRECT_URI: ${NEXT_PUBLIC_GOOGLE_REDIRECT_URI}
    init: true
    secrets:
      - nextauth_secret
      - google_client_id
      - google_client_secret

secrets:
  nextauth_secret:
    file: ./secrets/nextauth_secret
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
